<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #fcfbf9;
      color: #2c2c2c;
      line-height: 1.6;
    }

    /* Hero */
    .hero {
      padding: 100px 20px 60px;
      text-align: center;
      background: linear-gradient(180deg, #fcfbf9 0%, #f5f0eb 100%);
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.2em;
      font-weight: 400;
      color: #1a1a1a;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .hero p {
      font-size: 1em;
      color: #888;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .hero-divider {
      width: 40px;
      height: 1px;
      background: #ccc;
      margin: 24px auto;
    }

    /* Gallery */
    .gallery {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 80px;
      columns: 3;
      column-gap: 20px;
    }

    .card {
      break-inside: avoid;
      margin-bottom: 20px;
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card-image {
      width: 100%;
      display: block;
      background: #f0ece6;
    }

    .card-body {
      padding: 20px 24px 24px;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.15em;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    .card-description {
      font-size: 0.88em;
      color: #888;
      line-height: 1.7;
      margin-bottom: 14px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-price {
      font-size: 1em;
      font-weight: 500;
      color: #1a1a1a;
    }

    .card-price.sold {
      color: #bbb;
      text-decoration: line-through;
      font-weight: 300;
    }

    .card-sold-badge {
      font-size: 0.78em;
      color: #999;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .tag {
      font-size: 0.75em;
      color: #999;
      letter-spacing: 0.5px;
      text-transform: lowercase;
    }

    .tag::before { content: '/ '; }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .lightbox.open { display: flex; }

    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      text-align: center;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 2px;
    }

    .lightbox-close {
      position: fixed;
      top: 24px;
      right: 32px;
      color: rgba(255,255,255,0.6);
      font-size: 2em;
      cursor: pointer;
      background: none;
      border: none;
      font-weight: 100;
      transition: color 0.2s;
    }

    .lightbox-close:hover { color: #fff; }

    .lightbox-info {
      margin-top: 20px;
      color: rgba(255,255,255,0.85);
    }

    .lightbox-info .title {
      font-family: 'Playfair Display', serif;
      font-size: 1.3em;
      margin-bottom: 6px;
    }

    .lightbox-info .desc {
      font-size: 0.9em;
      color: rgba(255,255,255,0.6);
    }

    .lightbox-info .price {
      font-size: 1em;
      color: rgba(255,255,255,0.85);
      margin-top: 12px;
    }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.3);
      font-size: 2.5em;
      cursor: pointer;
      background: none;
      border: none;
      padding: 20px;
      transition: color 0.2s;
      font-weight: 100;
    }

    .lightbox-nav:hover { color: rgba(255,255,255,0.8); }
    .lightbox-nav.prev { left: 10px; }
    .lightbox-nav.next { right: 10px; }

    footer {
      text-align: center;
      padding: 40px 20px 60px;
      color: #ccc;
      font-size: 0.82em;
    }

    .empty {
      text-align: center;
      padding: 80px 20px;
      color: #bbb;
      font-family: 'Playfair Display', serif;
      font-size: 1.2em;
      column-span: all;
    }

    @media (max-width: 900px) {
      .gallery { columns: 2; }
      .hero h1 { font-size: 2.2em; }
    }

    @media (max-width: 600px) {
      .gallery { columns: 1; }
      .hero { padding: 60px 20px 40px; }
      .hero h1 { font-size: 1.8em; }
      .lightbox-nav { font-size: 1.5em; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Галерея</h1>
    <div class="hero-divider"></div>
    <p>Картины</p>
  </div>

  <div class="gallery" id="gallery"></div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">&#10005;</button>
    <button class="lightbox-nav prev" onclick="navigate(-1)">&#8249;</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="">
      <div class="lightbox-info" id="lightbox-info"></div>
    </div>
    <button class="lightbox-nav next" onclick="navigate(1)">&#8250;</button>
  </div>

  <footer>&copy; 2026</footer>

  <script>
    let paintings = [];
    let currentId = 0;

    async function loadGallery() {
      try {
        const res = await fetch('paintings.json');
        paintings = await res.json();
        renderGallery();
      } catch {
        document.getElementById('gallery').innerHTML =
          '<div class="empty">Галерея пока пуста</div>';
      }
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      if (!paintings.length) {
        gallery.innerHTML = '<div class="empty">Галерея пока пуста</div>';
        return;
      }
      gallery.innerHTML = paintings.map(p => `
        <div class="card" onclick="openLightbox(${p.id})">
          <img class="card-image" src="${p.image}" alt="${p.title}"
               onerror="this.style.padding='40%';this.style.background='#f0ece6'">
          <div class="card-body">
            <div class="card-title">${p.title}</div>
            ${p.description ? `<div class="card-description">${p.description}</div>` : ''}
            ${p.tags?.length ? `<div class="card-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
            <div class="card-footer">
              <span class="card-price ${p.sold ? 'sold' : ''}">
                ${p.sold ? '— продано —' : (p.price ? p.price.toLocaleString() + ' ₽' : '')}
              </span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openLightbox(id) {
      currentId = id;
      const p = paintings.find(x => x.id === id);
      if (!p) return;
      document.getElementById('lightbox-img').src = p.image;
      document.getElementById('lightbox-info').innerHTML =
        `<div class="title">${p.title}</div>` +
        (p.description ? `<div class="desc">${p.description}</div>` : '') +
        (p.price && !p.sold ? `<div class="price">${p.price.toLocaleString()} ₽</div>` : p.sold ? `<div class="price" style="opacity:0.5">Продано</div>` : '');
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    function navigate(dir) {
      const idx = paintings.findIndex(x => x.id === currentId);
      const next = (idx + dir + paintings.length) % paintings.length;
      openLightbox(paintings[next].id);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });

    loadGallery();
  </script>
</body>
</html>
