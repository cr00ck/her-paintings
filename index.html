<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #d4ebf7;
      color: #111;
      line-height: 1.5;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid #4a7a7d;
      background: #5A8D92;
    }

    header .logo {
      font-size: 1.2em;
      font-weight: 600;
      text-decoration: none;
      color: #d4756b;
      font-family: 'Playfair Display', serif;
    }

    header nav {
      display: flex;
      gap: 16px;
    }

    header nav a {
      background: none;
      border: none;
      font-size: 0.88em;
      color: rgba(255,255,255,0.75);
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      transition: color 0.2s;
    }

    header nav a:hover { color: #fff; }

    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 80px 24px 60px;
    }

    .hero-wrap {
      background: #5a8db0;
      border-bottom: 1px solid #4a7a9a;
    }

    .hero h1 { color: #fff; }
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3em;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.1;
      max-width: 600px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #fff;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.15em;
      opacity: 0.85;
    }



    .gallery {
      columns: 3;
      column-gap: 20px;
    }

    .card {
      cursor: pointer;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      break-inside: avoid;
      margin-bottom: 20px;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    }

    .card-image-wrap {
      background: #eef5fa;
      overflow: hidden;
    }

    .card-body {
      padding: 0 16px 20px;
    }

    .card-image {
      width: 100%;
      display: block;
      background: #f0f0f0;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.05em;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .card-meta {
      font-size: 0.85em;
      color: #888;
    }

    .card-meta .sold {
      color: #aaa;
      text-decoration: line-through;
    }

    .card-tags {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .card-tags span {
      font-size: 0.78em;
      color: #aaa;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .lightbox.open { display: flex; }

    .lightbox-content {
      text-align: center;
      max-width: 90vw;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 4px;
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 28px;
      color: rgba(255,255,255,0.5);
      font-size: 2em;
      cursor: pointer;
      background: none;
      border: none;
      transition: color 0.2s;
    }

    .lightbox-close:hover { color: #fff; }

    .lightbox-info {
      margin-top: 20px;
      color: rgba(255,255,255,0.8);
    }

    .lightbox-info .title {
      font-size: 1.2em;
      font-weight: 500;
    }

    .lightbox-info .desc {
      font-size: 0.9em;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
    }

    .lightbox-info .price {
      margin-top: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.8);
    }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.3);
      font-size: 2em;
      cursor: pointer;
      background: none;
      border: none;
      padding: 20px;
      transition: color 0.2s;
    }

    .lightbox-nav:hover { color: rgba(255,255,255,0.8); }
    .lightbox-nav.prev { left: 10px; }
    .lightbox-nav.next { right: 10px; }

    footer {
      text-align: center;
      padding: 40px 24px 60px;
      color: #d4756b;
      font-size: 0.82em;
    }

    .filter {
      background: rgba(255,255,255,0.6);
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.88em;
      font-family: inherit;
      color: #555;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter:hover { background: rgba(255,255,255,0.9); color: #111; }
    .filter.active { background: #5a8db0; color: #fff; }

    .content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }

    .main {
      flex: 1;
      min-width: 0;
    }

    .main .filters {
      padding: 20px 0 24px;
      justify-content: flex-start;
    }

    .main .gallery {
      padding: 0 0 80px;
    }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      position: sticky;
      top: 24px;
      padding-top: 24px;
    }

    .author-card {
      text-align: center;
    }

    .author-photo {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    .author-card h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 1em;
      line-height: 1.6;
      color: #444;
    }

    @media (max-width: 800px) {
      .content { flex-direction: column; }
      .sidebar { width: 100%; position: static; text-align: center; }
      .author-photo { width: 120px; height: 120px; }
      .main .filters { justify-content: center; }
    }

    .empty {
      column-span: all;
      text-align: center;
      padding: 80px 20px;
      color: #bbb;
    }

    @media (max-width: 900px) {
      .main .gallery { columns: 2; }
      .hero h1 { font-size: 2em; }
    }

    @media (max-width: 600px) {
      .main .gallery { columns: 1; }
      header { flex-direction: column; gap: 12px; }
      .hero { padding: 40px 24px 30px; }
      .hero h1 { font-size: 1.5em; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">Галерея</a>
    <nav>
      <a href="https://instagram.com" target="_blank">Instagram</a>
      <a href="mailto:email@mail.ru">Связаться</a>
    </nav>
  </header>

  <div class="hero-wrap">
    <div class="hero">
      <h1>Картины</h1>
      <p>Галерея</p>
    </div>
  </div>

  <div class="content">
    <div class="main">
      <div class="filters">
        <button class="filter active" data-filter="all">Все</button>
        <button class="filter" data-filter="натюрморт">Натюрморт</button>
        <button class="filter" data-filter="архитектура">Архитектура</button>
        <button class="filter" data-filter="природа">Природа</button>
        <button class="filter" data-filter="люди">Люди</button>
      </div>

      <div class="gallery" id="gallery"></div>
    </div>

    <aside class="sidebar">
      <div class="author-card">
        <img class="author-photo" src="assets/images/20260627_135343(1).jpg" alt="Бяльская Кристина Сергеевна">
        <h2>Бяльская<br>Кристина<br>Сергеевна</h2>
      </div>
    </aside>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">&#10005;</button>
    <button class="lightbox-nav prev" onclick="navigate(-1)">&#8249;</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="">
      <div class="lightbox-info" id="lightbox-info"></div>
    </div>
    <button class="lightbox-nav next" onclick="navigate(1)">&#8250;</button>
  </div>

  <footer>&copy; 2026</footer>

  <script>
    let paintings = [];
    let currentId = 0;
    let activeFilter = 'all';

    async function loadGallery() {
      try {
        const res = await fetch('paintings.json');
        paintings = await res.json();
        renderGallery();
      } catch {
        document.getElementById('gallery').innerHTML =
          '<div class="empty">Галерея пока пуста</div>';
      }
    }

    function setFilter(tag) {
      activeFilter = tag;
      document.querySelectorAll('.filter').forEach(b => b.classList.toggle('active', b.dataset.filter === tag));
      renderGallery();
    }

    document.querySelectorAll('.filter').forEach(b => b.addEventListener('click', () => setFilter(b.dataset.filter)));

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      if (!paintings.length) {
        gallery.innerHTML = '<div class="empty">Галерея пока пуста</div>';
        return;
      }
      const filtered = activeFilter === 'all' ? paintings : paintings.filter(p => p.tags.includes(activeFilter));
      if (!filtered.length) {
        gallery.innerHTML = '<div class="empty">По выбранным параметрам ничего не найдено</div>';
        return;
      }
      gallery.innerHTML = filtered.map(p => `
        <div class="card" onclick="openLightbox(${p.id})">
          <div class="card-image-wrap">
            <img class="card-image" src="${p.image}" alt="${p.title}"
                 onerror="this.style.padding='60%';this.style.background='#f0f0f0'">
          </div>
          <div class="card-body">
            <div class="card-title">${p.title}</div>
            <div class="card-meta">
              ${p.sold ? '<span class="sold">Продано</span>' : (p.price ? p.price.toLocaleString() + ' ₽' : '')}
            </div>
            ${p.tags?.length ? `<div class="card-tags">${p.tags.map(t => `<span>${t}</span>`).join('')}</div>` : ''}
          </div>
        </div>
      `).join('');
    }

    function openLightbox(id) {
      currentId = id;
      const p = paintings.find(x => x.id === id);
      if (!p) return;
      document.getElementById('lightbox-img').src = p.image;
      document.getElementById('lightbox-info').innerHTML =
        `<div class="title">${p.title}</div>` +
        (p.description ? `<div class="desc">${p.description}</div>` : '') +
        (p.price && !p.sold ? `<div class="price">${p.price.toLocaleString()} ₽</div>` : p.sold ? `<div class="price" style="opacity:0.5">Продано</div>` : '');
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    function navigate(dir) {
      const idx = paintings.findIndex(x => x.id === currentId);
      const next = (idx + dir + paintings.length) % paintings.length;
      openLightbox(paintings[next].id);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });

    loadGallery();
  </script>
</body>
</html>
