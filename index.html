<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #d4ebf7;
      color: #111;
      line-height: 1.5;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid #7aa8c7;
      background: #5a8db0;
    }

    header .logo {
      font-size: 1.1em;
      font-weight: 600;
      text-decoration: none;
      color: #d4756b;
    }

    header nav {
      display: flex;
      gap: 16px;
    }

    header nav a {
      background: none;
      border: none;
      font-size: 0.88em;
      color: rgba(255,255,255,0.75);
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      transition: color 0.2s;
    }

    header nav a:hover { color: #fff; }

    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 80px 24px 60px;
    }

    .hero-wrap {
      background: #5a8db0;
      border-bottom: 1px solid #4a7a9a;
    }

    .hero h1, .hero p { color: #fff; }
    .hero p { opacity: 0.8; }

    .hero h1 {
      font-size: 2.8em;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      max-width: 600px;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 1.05em;
      color: #888;
      max-width: 500px;
    }

    .gallery {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 80px;
      columns: 3;
      column-gap: 20px;
    }

    .card {
      cursor: pointer;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      break-inside: avoid;
      margin-bottom: 20px;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    }

    .card-image-wrap {
      background: #eef5fa;
      overflow: hidden;
    }

    .card-body {
      padding: 0 16px 20px;
    }

    .card-image {
      width: 100%;
      display: block;
      background: #f0f0f0;
    }

    .card-title {
      font-size: 1em;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .card-meta {
      font-size: 0.85em;
      color: #888;
    }

    .card-meta .sold {
      color: #aaa;
      text-decoration: line-through;
    }

    .card-tags {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .card-tags span {
      font-size: 0.78em;
      color: #aaa;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .lightbox.open { display: flex; }

    .lightbox-content {
      text-align: center;
      max-width: 90vw;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 4px;
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 28px;
      color: rgba(255,255,255,0.5);
      font-size: 2em;
      cursor: pointer;
      background: none;
      border: none;
      transition: color 0.2s;
    }

    .lightbox-close:hover { color: #fff; }

    .lightbox-info {
      margin-top: 20px;
      color: rgba(255,255,255,0.8);
    }

    .lightbox-info .title {
      font-size: 1.2em;
      font-weight: 500;
    }

    .lightbox-info .desc {
      font-size: 0.9em;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
    }

    .lightbox-info .price {
      margin-top: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.8);
    }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.3);
      font-size: 2em;
      cursor: pointer;
      background: none;
      border: none;
      padding: 20px;
      transition: color 0.2s;
    }

    .lightbox-nav:hover { color: rgba(255,255,255,0.8); }
    .lightbox-nav.prev { left: 10px; }
    .lightbox-nav.next { right: 10px; }

    footer {
      text-align: center;
      padding: 40px 24px 60px;
      color: #d4756b;
      font-size: 0.82em;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: #bbb;
    }

    @media (max-width: 900px) {
      .gallery { columns: 2; }
      .hero h1 { font-size: 2em; }
    }

    @media (max-width: 600px) {
      .gallery { columns: 1; }
      header { flex-direction: column; gap: 12px; }
      .hero { padding: 40px 24px 30px; }
      .hero h1 { font-size: 1.5em; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">Галерея</a>
    <nav>
      <a href="https://instagram.com" target="_blank">Instagram</a>
      <a href="mailto:email@mail.ru">Связаться</a>
    </nav>
  </header>

  <div class="hero-wrap">
    <div class="hero">
      <h1>Картины</h1>
      <p>Галерея</p>
    </div>
  </div>

  <div class="gallery" id="gallery"></div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">&#10005;</button>
    <button class="lightbox-nav prev" onclick="navigate(-1)">&#8249;</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="">
      <div class="lightbox-info" id="lightbox-info"></div>
    </div>
    <button class="lightbox-nav next" onclick="navigate(1)">&#8250;</button>
  </div>

  <footer>&copy; 2026</footer>

  <script>
    let paintings = [];
    let currentId = 0;

    async function loadGallery() {
      try {
        const res = await fetch('paintings.json');
        paintings = await res.json();
        renderGallery();
      } catch {
        document.getElementById('gallery').innerHTML =
          '<div class="empty">Галерея пока пуста</div>';
      }
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      if (!paintings.length) {
        gallery.innerHTML = '<div class="empty">Галерея пока пуста</div>';
        return;
      }
      gallery.innerHTML = paintings.map(p => `
        <div class="card" onclick="openLightbox(${p.id})">
          <div class="card-image-wrap">
            <img class="card-image" src="${p.image}" alt="${p.title}"
                 onerror="this.style.padding='60%';this.style.background='#f0f0f0'">
          </div>
          <div class="card-body">
            <div class="card-title">${p.title}</div>
            <div class="card-meta">
              ${p.sold ? '<span class="sold">Продано</span>' : (p.price ? p.price.toLocaleString() + ' ₽' : '')}
            </div>
            ${p.tags?.length ? `<div class="card-tags">${p.tags.map(t => `<span>${t}</span>`).join('')}</div>` : ''}
          </div>
        </div>
      `).join('');
    }

    function openLightbox(id) {
      currentId = id;
      const p = paintings.find(x => x.id === id);
      if (!p) return;
      document.getElementById('lightbox-img').src = p.image;
      document.getElementById('lightbox-info').innerHTML =
        `<div class="title">${p.title}</div>` +
        (p.description ? `<div class="desc">${p.description}</div>` : '') +
        (p.price && !p.sold ? `<div class="price">${p.price.toLocaleString()} ₽</div>` : p.sold ? `<div class="price" style="opacity:0.5">Продано</div>` : '');
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    function navigate(dir) {
      const idx = paintings.findIndex(x => x.id === currentId);
      const next = (idx + dir + paintings.length) % paintings.length;
      openLightbox(paintings[next].id);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });

    loadGallery();
  </script>
</body>
</html>
