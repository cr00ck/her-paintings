<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      line-height: 1.6;
    }

    header {
      padding: 60px 20px 40px;
      text-align: center;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    header h1 {
      font-size: 2.5em;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    header p {
      color: #666;
      font-size: 1.1em;
    }

    .gallery {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }

    .card-image {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
      background: #f0f0f0;
    }

    .card-body {
      padding: 20px;
    }

    .card-title {
      font-size: 1.2em;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .card-description {
      color: #666;
      font-size: 0.95em;
      margin-bottom: 12px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-price {
      font-size: 1.1em;
      font-weight: 600;
      color: #1a1a1a;
    }

    .card-price.sold {
      color: #999;
      text-decoration: line-through;
    }

    .card-sold-badge {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85em;
    }

    .card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .tag {
      background: #f0f0f0;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.8em;
      color: #666;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .lightbox.open { display: flex; }

    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 4px;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 2em;
      cursor: pointer;
      background: none;
      border: none;
    }

    .lightbox-info {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      text-align: center;
      background: rgba(0,0,0,0.6);
      padding: 12px 24px;
      border-radius: 8px;
      max-width: 80%;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 0.9em;
    }

    .empty {
      text-align: center;
      padding: 80px 20px;
      color: #999;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.8em; }
      .gallery { grid-template-columns: 1fr; }
      .card-image { height: 240px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Галерея</h1>
    <p>Картины</p>
  </header>

  <div class="gallery" id="gallery"></div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-info" id="lightbox-info"></div>
  </div>

  <footer>&copy; 2026</footer>

  <script>
    let paintings = [];

    async function loadGallery() {
      try {
        const res = await fetch('paintings.json');
        paintings = await res.json();
        renderGallery();
      } catch (e) {
        document.getElementById('gallery').innerHTML =
          '<div class="empty">Галерея пока пуста</div>';
      }
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      if (!paintings.length) {
        gallery.innerHTML = '<div class="empty">Галерея пока пуста</div>';
        return;
      }
      gallery.innerHTML = paintings.map(p => `
        <div class="card" onclick="openLightbox(${p.id})">
          <img class="card-image" src="${p.image}" alt="${p.title}"
               onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 320%22><rect fill=%22%23f0f0f0%22 width=%22400%22 height=%22320%22/><text fill=%22%23999%22 font-size=%2220%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22>Нет фото</text></svg>'">
          <div class="card-body">
            <div class="card-title">${p.title}</div>
            <div class="card-description">${p.description || ''}</div>
            <div class="card-tags">${(p.tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}</div>
            <div class="card-footer" style="margin-top:12px">
              <span class="card-price ${p.sold ? 'sold' : ''}">
                ${p.sold ? 'Продано' : (p.price ? p.price.toLocaleString() + ' ₽' : '')}
              </span>
              ${p.sold ? '<span class="card-sold-badge">Продано</span>' : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function openLightbox(id) {
      const p = paintings.find(x => x.id === id);
      if (!p) return;
      document.getElementById('lightbox-img').src = p.image;
      document.getElementById('lightbox-info').innerHTML =
        `<strong>${p.title}</strong>${p.description ? '<br>' + p.description : ''}${p.price && !p.sold ? '<br><strong>' + p.price.toLocaleString() + ' ₽</strong>' : ''}`;
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox(e) {
      if (!e || e.target === e.currentTarget || e.target.tagName === 'BUTTON') {
        document.getElementById('lightbox').classList.remove('open');
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });

    loadGallery();
  </script>
</body>
</html>
